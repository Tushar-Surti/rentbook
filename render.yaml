# Render blueprint: New > Blueprint, pick this repo. Values marked sync: false are asked for on creation.
# The database lives outside Render (Neon's free Postgres); see docs/deployment.md.
services:
  - type: web
    name: rentbook-api
    runtime: docker
    region: singapore
    # Free sleeps after 15 minutes without traffic: the first request wakes it in about a minute, and
    # scheduled reminders only run while it's awake. Switch to "starter" to keep it always on.
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Neon's direct host (not the -pooler one: Flyway's migration lock needs a session), for example
      # jdbc:postgresql://ep-….aws.neon.tech/rentdesk?sslmode=require
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: RENTBOOK_JWT_SECRET
        generateValue: true
      - key: RENTBOOK_APP_BASE_URL
        sync: false
      - key: RENTBOOK_CORS_ORIGINS
        sync: false
      # Brevo SMTP: the login is the …@smtp-brevo.com value, the password an SMTP key (not the API key).
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: RENTBOOK_PLATFORM_FEE_BPS
        value: "200"
      # Razorpay test-mode keys. Left empty, online payments stay off (see docs/deployment.md).
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      # S3-compatible storage for maintenance photos (Cloudflare R2 recommended; see docs/deployment.md).
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_REGION
        value: auto
      # "log" writes reminder texts to the log. Switch to "twilio" once TWILIO_* are set (see docs/deployment.md).
      - key: RENTBOOK_SMS_PROVIDER
        value: log
