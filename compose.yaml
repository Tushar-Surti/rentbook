name: rentbook

# Infrastructure starts with `docker compose up -d` (or automatically when the
# backend runs with the dev profile). `--profile app` also runs the backend and
# frontend in containers.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: rentbook
      POSTGRES_USER: rentbook
      POSTGRES_PASSWORD: rentbook
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rentbook -d rentbook"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # MinIO no longer publishes images to Docker Hub or Quay; Bitnami's legacy build still downloads.
    # It creates the bucket on first start (the backend's dev profile would create it too).
    image: bitnamilegacy/minio:2025.7.23
    environment:
      MINIO_ROOT_USER: rentbook
      MINIO_ROOT_PASSWORD: rentbook-secret
      MINIO_DEFAULT_BUCKETS: rentbook-docs
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:5173
    ports:
      - "9000:9000"
    volumes:
      - miniodata:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.31.1
    ports:
      - "1025:1025"
      - "8025:8025"

  backend:
    profiles: ["app"]
    build: ./backend
    # Razorpay keys and other local secrets, when the repo root has a .env.
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/rentbook
      SPRING_DATASOURCE_USERNAME: rentbook
      SPRING_DATASOURCE_PASSWORD: rentbook
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: "1025"
    ports:
      - "8080:8080"

  frontend:
    profiles: ["app"]
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_PROXY_TARGET: http://backend:8080
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
  miniodata:
  frontend_node_modules:
