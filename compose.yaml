name: rentbook

# Infrastructure starts with `docker compose up -d` (or automatically when the
# backend runs with the dev profile). `--profile app` also runs the backend and
# frontend in containers.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: rentbook
      POSTGRES_USER: rentbook
      POSTGRES_PASSWORD: rentbook
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rentbook -d rentbook"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # MinIO stopped publishing community images after this release, so the tag is pinned.
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: rentbook
      MINIO_ROOT_PASSWORD: rentbook-secret
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:5173
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 rentbook rentbook-secret &&
      mc mb --ignore-existing local/rentbook-docs &&
      mc anonymous set none local/rentbook-docs
      "
    restart: "no"
    labels:
      org.springframework.boot.ignore: "true"

  mailpit:
    image: axllent/mailpit:v1.31.1
    ports:
      - "1025:1025"
      - "8025:8025"

  backend:
    profiles: ["app"]
    build: ./backend
    # Razorpay keys and other local secrets, when the repo root has a .env.
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/rentbook
      SPRING_DATASOURCE_USERNAME: rentbook
      SPRING_DATASOURCE_PASSWORD: rentbook
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: "1025"
    ports:
      - "8080:8080"

  frontend:
    profiles: ["app"]
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_PROXY_TARGET: http://backend:8080
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
  miniodata:
  frontend_node_modules:
